name: Market Share — base ANP

# Baixa a base aberta da ANP de vendas das distribuidoras (liquidos.zip) e
# regrava mercado/anp-vendas.json. Roda no GitHub porque o ambiente da nuvem
# do Claude Code não alcança o gov.br. Roda todo dia de madrugada; só commita
# quando a ANP publicou algo novo (a ANP fecha o mês M na segunda quinzena de M+1).
on:
  schedule:
    - cron: '45 6 * * *' # 03:45 em Brasília, todo dia
  push:
    paths:
      - '.github/workflows/mercado-anp.yml'
      - 'scripts/mercado-anp.mjs'
  workflow_dispatch:
    inputs:
      inspecionar:
        description: 'Só descrever os arquivos da ANP (cabeçalho, valores), sem gravar'
        type: boolean
        default: false
      desde:
        description: 'Primeiro mês da série (AAAA-MM)'
        type: string
        default: '2024-01'

permissions:
  contents: write

concurrency:
  group: mercado-anp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Baixar liquidos.zip da ANP
        id: baixa
        run: |
          mkdir -p /tmp/anp/csv
          URL='https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/arquivos/mdpg/liquidos.zip'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          ok=0
          # o gov.br às vezes derruba a conexão vinda dos servidores do GitHub (curl 35):
          # alterna HTTP/1.1 e HTTP/2 e espera mais entre as tentativas
          for i in 1 2 3 4 5 6; do
            if [ $((i % 2)) -eq 1 ]; then V='--http1.1'; else V=''; fi
            if curl -L --fail $V --tlsv1.2 --max-time 900 -A "$UA" -H 'Accept: application/zip,*/*' -o /tmp/anp/liquidos.zip "$URL"; then ok=1; break; fi
            echo "tentativa $i falhou; aguardando"; sleep $((i*45))
          done
          if [ "$ok" = 1 ] && unzip -tq /tmp/anp/liquidos.zip >/dev/null 2>&1; then
            ls -la /tmp/anp/liquidos.zip
            unzip -o -q /tmp/anp/liquidos.zip -d /tmp/anp/csv
            find /tmp/anp/csv -type f -printf '%s\t%p\n' | sort -k2
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            # sem o arquivo da ANP o painel segue com a última base publicada; tenta de novo no próximo dia
            echo "::warning::A ANP não respondeu nesta execução; a base anterior foi mantida."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Inspecionar (cabeçalho, valores distintos, linhas por ano)
        if: ${{ steps.baixa.outputs.ok == 'true' }}
        run: node scripts/mercado-anp.mjs --pasta /tmp/anp/csv --inspeciona
      - name: Agregar
        if: ${{ steps.baixa.outputs.ok == 'true' && !inputs.inspecionar }}
        run: node scripts/mercado-anp.mjs --pasta /tmp/anp/csv --saida mercado/anp-vendas.json --desde '${{ inputs.desde || '2024-01' }}'
      - name: Publicar se mudou
        if: ${{ steps.baixa.outputs.ok == 'true' && !inputs.inspecionar }}
        run: |
          git add mercado/anp-vendas.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git config user.name 'Rotina Market Share'
          git config user.email 'noreply@estacaosapatao.com.br'
          git commit -m 'chore: atualiza a base ANP do Market Share (automático)'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
