name: Market Share — frota por município (Senatran)

# Baixa as planilhas mensais "Frota por município e tipo" da Senatran e grava
# mercado/frota.json com o RS e os municípios da região (leves, motos, pesados,
# total). Dados públicos. Roda no GitHub porque o ambiente da nuvem não alcança
# o gov.br. Todo dia 15 (a Senatran publica o mês com ~1 mês de atraso).
on:
  schedule:
    - cron: '30 8 15 * *'
  push:
    paths:
      - '.github/workflows/mercado-frota.yml'
      - 'scripts/mercado-frota.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercado-frota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet openpyxl==3.1.5
      - name: Baixar as planilhas de frota por município e tipo
        run: |
          mkdir -p /tmp/fr && cd /tmp/fr
          UA='Mozilla/5.0 (painel-estacao-operacional; GitHub Actions)'
          B='https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-Senatran'
          for pg in frota-de-veiculos-2025 frota-de-veiculos-2026 frota-de-veiculos-2026/frota-de-veiculos-2026-2 frota-de-veiculos-2026-2; do
            curl -sL --max-time 90 -A "$UA" "$B/$pg" >> paginas.html || true
          done
          grep -oiE 'href="[^"]*"' paginas.html | sed -E 's/^href="//; s/"$//' | grep -iE 'munic[a-z]*[_ e]*_?(e_)?tipo|municipioetipo|municpioetipo|municipio_tipo|municipio_e_tipo' | grep -viE 'uf_e_tipo|ufetipo|restric|cep|cor|combust|potenc|ano_fab|especie' | sort -u | tee links.txt
          while read -r u; do
            case "$u" in http*) ;; *) u="https://www.gov.br$u";; esac
            f=$(echo "$u" | sed -E 's#/@@download/file##; s#.*/##')
            curl -sL --fail --retry 3 --max-time 300 -A "$UA" -o "$f" "$u" && echo "ok $f $(wc -c < "$f")" || echo "falhou $u"
          done < links.txt
      - name: Agregar a região
        run: |
          python3 -c "import json;a=json.load(open('mercado/regiao-municipios.json'));b=json.load(open('mercado/regiao-raio.json'));s=sorted(set([m for v in a['unidades'].values() for m in v]+b['municipios_candidatos']));json.dump(s,open('/tmp/fr/municipios.json','w'))"
          python3 scripts/mercado-frota.py /tmp/fr /tmp/fr/municipios.json mercado/frota.json
      - name: Publicar se mudou
        run: |
          git add mercado/frota.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git config user.name 'Rotina Market Share'
          git config user.email 'noreply@estacaosapatao.com.br'
          git commit -m 'chore: atualiza a frota por município no Market Share (automático)'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
