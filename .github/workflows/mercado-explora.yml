name: Market Share — exploração (temporário)

# Baixa documentação pública da ANP para descobrir onde estão tancagem e bicos
# dos postos. Só imprime no log; não grava nada no repositório. Apagar depois.
on:
  push:
    paths:
      - '.github/workflows/mercado-explora.yml'
  workflow_dispatch:

jobs:
  explora:
    runs-on: ubuntu-latest
    steps:
      - name: API de revendedores (formato da resposta)
        run: |
          UA='Mozilla/5.0 (painel-estacao-operacional; GitHub Actions)'
          for q in 'cnpj=13047383000103' 'cnpj=43510250000184' 'cnpj=47857489000186' 'cnpj=63657421000100'; do
            echo "== $q"; curl -sS --max-time 120 -A "$UA" "https://revendedoresapi.anp.gov.br/v1/combustivel?$q" | head -c 6000; echo
          done
          echo "== municipio"; curl -sS --max-time 180 -A "$UA" "https://revendedoresapi.anp.gov.br/v1/combustivel?municipio=ESTANCIA%20VELHA&uf=RS" | head -c 1500; echo
