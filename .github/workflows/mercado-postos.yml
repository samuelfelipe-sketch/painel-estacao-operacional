name: Market Share — postos no raio de cada unidade

# Baixa o cadastro público de postos da ANP, acha as coordenadas pelo endereço
# (OpenStreetMap/Nominatim, com cache em mercado/postos-geo.json) e grava
# mercado/postos-raio.json com os concorrentes no raio de cada unidade
# (configuração em mercado/regiao-raio.json). Dados públicos. Roda no GitHub
# porque o ambiente da nuvem não alcança o gov.br. Toda semana (segunda).
on:
  schedule:
    - cron: '15 8 * * 1'
  push:
    paths:
      - '.github/workflows/mercado-postos.yml'
      - 'scripts/mercado-postos.mjs'
      - 'mercado/regiao-raio.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercado-postos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Baixar o cadastro de revendedores da ANP
        run: |
          mkdir -p /tmp/p
          curl -sL --fail --retry 3 --retry-delay 10 --max-time 600 \
            -A 'Mozilla/5.0 (painel-estacao-operacional; GitHub Actions)' \
            -o /tmp/p/cadastro.csv \
            'https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/arquivos/arquivos-dados-cadastrais-dos-revendedores-varejistas-de-combustiveis-automotivos/dados-cadastrais-revendedores-varejistas-combustiveis-automoveis.csv'
          wc -l /tmp/p/cadastro.csv
      - name: Postos no raio
        run: node scripts/mercado-postos.mjs --cadastro /tmp/p/cadastro.csv --config mercado/regiao-raio.json --cache mercado/postos-geo.json --saida mercado/postos-raio.json
      - name: Publicar se mudou
        run: |
          git add mercado/postos-raio.json mercado/postos-geo.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git config user.name 'Rotina Market Share'
          git config user.email 'noreply@estacaosapatao.com.br'
          git commit -m 'chore: atualiza os postos no raio das unidades no Market Share (automático)'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
